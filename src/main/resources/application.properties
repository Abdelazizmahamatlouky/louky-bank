spring.application.name=louky-bank

server.address=0.0.0.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration



loukybank.jwt.issuer=louky-bank-creditflow
loukybank.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
loukybank.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

loukybank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.louky.bank=INFO