spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LoukyBankHikariPool


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC


spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE:false}
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true


loukybank.jwt.secret=${JWT_SECRET}
loukybank.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:900000}
loukybank.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}
loukybank.jwt.issuer=louky-bank-creditflow


springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false


loukybank.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}


logging.level.root=WARN
logging.level.com.louky.bank=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN


management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=DIRECTEUR


server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.http2.enabled=true
server.tomcat.max-threads=${SERVER_MAX_THREADS:50}
server.tomcat.accept-count=50


server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false